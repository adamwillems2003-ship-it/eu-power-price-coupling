[project]
name = "coupling"
version = "0.1.0"
description = "How well are European day-ahead power prices coupled, and where do they break apart?"
requires-python = ">=3.11"
dependencies = [
    "entsoe-py>=0.8.1",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "statsmodels>=0.14",
    "matplotlib>=3.8",
    "seaborn>=0.13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "jupyter", "nbconvert", "ipykernel"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
